name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate repository
        run: python tests/validate_repository.py

      - name: Validate skill package
        shell: pwsh
        run: ./skills/ai-act-web-compliance/scripts/verify-pack.ps1

      - name: Compile Python sources
        run: python -m compileall -q skills/ai-act-web-compliance/scripts tests
